<html lang="en">
<head>

<meta charset="UTF-8">

<title>Kayode Olumoyin - Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ===== Global ===== */

:root{
    --bg:#0b1020;
    --card:#12182b;
    --accent:#4f8cff;
    --text:#f5f7fa;
    --muted:#aab4c5;
    --border:rgba(255,255,255,0.08);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:
        radial-gradient(circle at top right,
        #1f3c88 0%,
        #0b1020 40%,
        #090d18 100%);

    color:var(--text);
    line-height:1.7;
}

/* ===== Navigation ===== */

.info2{
    width:100%;
    padding:28px 20px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(14px);
    background:rgba(10,15,30,0.55);
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.info2 a{
    text-decoration:none;
    color:var(--muted);
    margin:0 12px;
    font-size:15px;
    font-weight:500;
    transition:all 0.25s ease;
}

.info2 a:hover{
    color:var(--text);
}

.spaced{
    color:rgba(255,255,255,0.2);
}

/* ===== Main Container ===== */

#vh{
    max-width:1100px;
    margin:70px auto;
    padding:70px;
    border-radius:28px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.03)
        );

    border:1px solid var(--border);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);

    backdrop-filter:blur(12px);
}

/* ===== Page Title ===== */

h1{
    text-align:center;
    font-size:4rem;
    font-weight:700;
    letter-spacing:-2px;
    margin-top:0;
    margin-bottom:60px;
    line-height:1.1;
}

/* ===== Notes List ===== */

.notes-list{
    list-style:none;
    padding:0;
    margin:0;
    display:grid;

    grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));

    gap:24px;
}

/* ===== Note Cards ===== */

.notes-list li{
    border-radius:22px;
    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.05),
            rgba(255,255,255,0.025)
        );

    border:1px solid rgba(255,255,255,0.05);

    transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.18);
}

.notes-list li:hover{
    transform:translateY(-6px);
    border-color:rgba(79,140,255,0.35);
    box-shadow:
        0 18px 40px rgba(0,0,0,0.28);
}

/* ===== Links ===== */

.notes-list li a{
    display:block;
    padding:28px;
    text-decoration:none;
    color:var(--text);
    transition:all 0.25s ease;
}

.notes-list li a:hover{
    color:#9fc0ff;
}

/* ===== Note Titles ===== */

.notes-list li i{
    font-style:normal;
    font-size:1.08rem;
    font-weight:500;
    line-height:1.6;
}

/* ===== General Links ===== */

a{
    color:var(--accent);
}

/* ===== Responsive ===== */

@media (max-width:900px){

    #vh{
        margin:30px 20px;
        padding:45px 30px;
    }

    h1{
        font-size:2.8rem;
    }
}

@media (max-width:600px){

    .info2{
        padding:22px 15px;
    }

    .info2 a{
        display:inline-block;
        margin:8px 8px;
        font-size:14px;
    }

    .spaced{
        display:none;
    }

    #vh{
        padding:35px 22px;
        border-radius:22px;
    }

    h1{
        font-size:2.2rem;
        margin-bottom:40px;
    }

    .notes-list{
        grid-template-columns:1fr;
        gap:18px;
    }

    .notes-list li a{
        padding:22px;
    }
}

</style>
</head>

<body>

</main>
